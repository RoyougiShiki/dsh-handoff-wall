# dsh-handoff-board bundle patch: inserts the dual-face plugin row into the
# web profile roster. Applied as a profile bundle layer (the `dsh.bundle.patch`
# manifest field); install with `dsh plugin --profile web add link:/mnt/f/AIProjects/dsh-plugins/dsh-handoff-wall`.
#
# The row is a bare plugin by package name: the host half (exports ".") runs in
# the dsh-web process (/handoff 命令 + board/read/write/who_else 四工具 +
# /handoff-board/* 路由)，and the `dsh.client` declaration in package.json makes
# the browser half (exports "./client") load in the web GUI.
- insert:
    - id: handoff-board
      name: '@dsh-external/dsh-handoff-board'
